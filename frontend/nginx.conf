server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Maksimalna velicina zahtjeva (predaje koda mogu biti vece)
    client_max_body_size 10M;

    # Gzip za brze ucitavanje na skolskoj mrezi
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ------------------------------------------------------------------
    # API proxy prema backendu.
    #
    # Frontend zove relativni /api, pa preglednik salje zahtjev na isti
    # posluzitelj s kojeg je ucitao stranicu. Nginx ga zatim prosljeduje
    # backendu unutar Docker mreze.
    #
    # Zbog toga adresa ne ovisi o tome tko otvara stranicu, i CORS
    # vise nije potreban jer je sve isti izvor.
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://adaptive-backend:8080/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Izvrsavanje koda i AI feedback znaju potrajati
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # OAuth2 tijek ide izravno na backend
    location /oauth2/ {
        proxy_pass http://adaptive-backend:8080/oauth2/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://adaptive-backend:8080/login/oauth2/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Staticke datoteke
    # ------------------------------------------------------------------

    # Zapakirani JS i CSS imaju hash u nazivu pa se mogu dugo kesirati
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - sve nepoznate rute idu na index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
