server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ------------------------------------------------------------------
    # API proxy prema backendu.
    #
    # Frontend zove relativni /api, pa preglednik salje zahtjev na isti
    # posluzitelj s kojeg je ucitao stranicu. Nginx ga prosljeduje backendu
    # unutar Docker mreze, pa CORS nije potreban.
    #
    # Napomena: nginx ime razrjesava jednom pri pokretanju. Ako backend
    # ponovno stvoris, restartaj i frontend.
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://adaptive-backend:8080/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ------------------------------------------------------------------
    # Povratna ruta nakon Google prijave je FRONTEND stranica, ne backend.
    # Znak jednakosti znaci tocno podudaranje i ima prednost pred blokom
    # /oauth2/ ispod, koji bi je inace uhvatio i poslao backendu.
    # ------------------------------------------------------------------
    location = /oauth2/callback {
        try_files /index.html =404;
    }

    # OAuth2 tijek ide izravno na backend
    location /oauth2/ {
        proxy_pass http://adaptive-backend:8080/oauth2/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://adaptive-backend:8080/login/oauth2/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Staticke datoteke
    # ------------------------------------------------------------------

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}