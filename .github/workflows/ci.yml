name: CI/CD

# Build i testovi na svaki push i pull request.
# Objava Docker slika na ghcr.io samo s grane main.
on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:

  # ==================================================================
  # BACKEND - Java 23 / Spring Boot / Maven
  # ==================================================================
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: Provjeri prevodi li se
        working-directory: ./backend
        run: mvn -B compile

      - name: Pokreni testove
        working-directory: ./backend
        run: mvn -B test

      - name: Objavi rezultate testova
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend testovi
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Zapakiraj
        working-directory: ./backend
        run: mvn -B package -DskipTests

  # ==================================================================
  # FRONTEND - React / TypeScript / Vite
  # ==================================================================
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instaliraj ovisnosti
        working-directory: ./frontend
        run: npm ci

      - name: Provjeri tipove
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080/api

  # ==================================================================
  # ML SERVIS - Python / FastAPI
  # ==================================================================
  ml-service:
    name: ML servis (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Instaliraj ovisnosti
        working-directory: ./ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Provjeri sintaksu
        working-directory: ./ml-service
        run: python -m compileall app -q

      - name: Pokreni testove
        working-directory: ./ml-service
        run: |
          if [ -d tests ]; then
            pytest tests -v
          else
            echo "Nema direktorija tests, preskacem."
          fi

  # ==================================================================
  # CODE EXECUTOR - Python
  # ==================================================================
  code-executor:
    name: Code executor (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Provjeri sintaksu
        working-directory: ./code-executor
        run: python -m compileall . -q

  # ==================================================================
  # DOCKER SLIKE - objava na ghcr.io
  # Pokrece se samo ako su svi prethodni poslovi prosli i to na main.
  # ==================================================================
  docker:
    name: Docker slike
    runs-on: ubuntu-latest
    needs: [ backend, frontend, ml-service, code-executor ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [ backend, frontend, ml-service, code-executor ]

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prijava na GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pripremi oznake
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build i objava
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            VITE_API_URL=/api

  # ==================================================================
  # SAZETAK
  # ==================================================================
  summary:
    name: Sažetak
    runs-on: ubuntu-latest
    needs: [ backend, frontend, ml-service, code-executor ]
    if: always()

    steps:
      - name: Ispisi rezultat
        run: |
          echo "## Rezultat izgradnje" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Komponenta | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ML servis | ${{ needs['ml-service'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code executor | ${{ needs['code-executor'].result }} |" >> $GITHUB_STEP_SUMMARY